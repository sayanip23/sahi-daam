<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sahi Daam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500&family=Mukta:wght@400;600&display=swap">
<style>
/* Deliberately single light theme: this mimics a light seller dashboard. */
:root{
  color-scheme:light;
  --bg:#F4F5F9; --card:#FFFFFF; --ink:#1F2433; --muted:#6B7185; --line:#E4E6ED; --soft:#F7F8FB;
  --side:#1E2A3B; --side-ink:#C9D0DC; --side-hi:#2D3B52;
  --brand:#E6467F; --brand-soft:#FDE8F0; --blue:#3F51B5;
  --sd:#0B7A68; --sd-soft:#E2F3EF; --sd-line:#9BD3C7;
  --loss:#C62828; --loss-soft:#FDECEA; --gain:#2E7D32; --gain-soft:#E7F4E8; --warn:#B26A00; --warn-soft:#FFF4DD;
  --chat:#ECE6DE; --bubble:#fff; --bubble-warn:#FFF2C6; --bubble-good:#DCF5D0; --bubble-me:#D5F1E7;
  --font:"Roboto","Mukta",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Roboto Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;margin:0}
button{font-family:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--sd);outline-offset:2px}

/* concept ribbon */
.ribbon{background:#11172A;color:#E7EAF3;font-size:12.5px;padding:7px 16px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between}
.ribbon b{color:#fff}
.key{display:inline-flex;align-items:center;gap:6px}
.key i{width:12px;height:12px;border-radius:3px;background:var(--sd);display:inline-block}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100% - 32px)}
aside{background:var(--side);color:var(--side-ink);padding:14px 0 24px}
.store{display:flex;gap:10px;align-items:center;padding:6px 18px 16px;border-bottom:1px solid #2F3A5C;margin-bottom:8px}
.store .av{width:34px;height:34px;border-radius:50%;background:#3A4670;color:#fff;display:grid;place-items:center;font-weight:700}
.store b{color:#fff;display:block;font-size:14px}
.store small{font-size:12px}
nav.side button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--side-ink);text-align:left;padding:10px 18px;font-size:14px;cursor:pointer;border-left:3px solid transparent}
nav.side button:hover{background:var(--side-hi)}
nav.side button[aria-current="page"]{background:var(--side-hi);color:#fff;border-left-color:var(--brand)}
nav.side svg{width:16px;height:16px;flex:none;opacity:.85}
.tag{margin-left:auto;font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 6px;background:#fff;color:var(--brand)}
.tag.sd{background:var(--sd);color:#fff}
.tag.red{background:#E53935;color:#fff}
nav.side .sdrow{box-shadow:inset 0 0 0 1px rgba(155,211,199,.25)}

main{padding:0 16px 40px;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;margin:0 -16px 16px;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(20,30,50,.05)}
.topbar h1{color:var(--ink)}
.topbar h1{font-size:20px;font-weight:500;margin:0}
.topbar .right{display:flex;gap:14px;align-items:center;color:var(--muted);font-size:13px}
.screen{max-width:1180px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px}
.card h2{font-size:16px;font-weight:500;margin:0 0 10px}
.btn{border:0;border-radius:6px;padding:9px 16px;font-weight:500;font-size:14px;cursor:pointer}
.btn.brand{background:var(--brand);color:#fff}
.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
.btn.blue{background:var(--blue);color:#fff;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.btn.sd{background:var(--sd);color:#fff}
.btn.sd-ghost{background:#fff;color:var(--sd);border:1px solid var(--sd)}
.btn.green{background:#2BA84A;color:#fff}
.btn:disabled{opacity:.5;cursor:default}

/* Sahi Daam additions */
.sd-box{border:1.5px solid var(--sd-line);background:var(--sd-soft);border-radius:8px;padding:14px}
.sd-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--sd)}
.sd-badge::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--sd)}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.loss{background:var(--loss-soft);color:var(--loss)} .pill.gain,.pill.ok{background:var(--gain-soft);color:var(--gain)} .pill.watch{background:var(--warn-soft);color:var(--warn)} .pill.na{background:var(--soft);color:var(--muted)}

/* home */
.hello{font-size:22px;font-weight:500;margin:0 0 4px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}
.tile .big{font-size:28px;font-weight:700;margin:4px 0}
.tile p{margin:0 0 12px;color:var(--muted)}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}

/* catalog form */
.cat-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:0;background:#fff;border:1px solid var(--line);border-radius:8px}
.cat-main{padding:18px;border-right:1px solid var(--line);min-width:0}
.cat-side{padding:18px}
.cat-main h2,.cat-side h2{color:var(--brand);font-weight:500;font-size:16px;margin:0 0 12px}
.steps{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;font-size:13px}
.steps .st{color:var(--muted);font-weight:500}.steps .st.on{color:var(--brand)}.steps .st.done{color:var(--gain)}
.steps i{flex:0 0 28px;height:1px;background:var(--line)}
.crumb{font-size:13px;color:var(--muted);margin-bottom:12px}.crumb span{margin:0 4px}.crumb a{color:var(--blue);margin-left:8px}
.copy{background:#F3F1FB;border-radius:6px;padding:8px 10px;font-size:12.5px;margin-bottom:12px}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 16px}
.f label{display:block;font-size:13px;margin-bottom:4px}
.f label em{color:var(--brand);font-style:normal}
.f input,.f select{width:100%;border:1px solid #CBD0DC;border-radius:4px;padding:7px 9px;font:inherit;background:#fff;color:var(--ink)}
.f.price input{border-color:var(--ink);border-width:1.5px}
.f.sdf label{color:var(--sd);font-weight:500}
.f.sdf input{border-color:var(--sd-line);background:#F5FBF9}
.inline-floor{margin-top:6px;font-size:12.5px;line-height:1.35}
.sd-panel{margin-top:16px}
.sd-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.sd-head h3{margin:4px 0 0;font-size:20px;font-weight:700}
.sd-head h3 .fl{color:var(--sd)}
.sd-nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.sd-nums>div{background:#fff;border:1px solid var(--sd-line);border-radius:6px;padding:8px 10px}
.sd-nums .v{font:500 18px var(--mono)}
.sd-nums .l{font-size:12px;color:var(--muted);line-height:1.3}
.bandbar{margin:10px 2px 0}
/* Meesho-style slider: thin track, pink fill to the thumb, white round thumb, tick marks with labels above, min/max below */
.ms{--c:var(--brand);--f:0;position:relative;padding:24px 0 0;margin:4px 0 0}
.ms.r2{padding-top:42px}
.ms.sd{--c:var(--sd)}
.ms .trk{position:relative;height:4px;border-radius:2px;background:linear-gradient(to right,var(--c) 0 calc(9px + (100% - 18px) * var(--f)),#DADDE5 0)}
.ms .tk{position:absolute;top:-5px;width:2px;height:14px;margin-left:-1px;background:var(--c);border-radius:1px}
.ms .tk.end{background:var(--c)}
.ms .tk.sdk{background:var(--sd)}.ms .tk.mee{background:var(--brand)}.ms .tk.gry{background:#8A90A0}
.ms .mtl{position:absolute;bottom:14px;transform:translateX(-50%);font:500 13px var(--font);color:#5A6072;white-space:nowrap}
.ms .mtl.up{bottom:32px}
.ms .mtl.L{transform:none;margin-left:-6px}.ms .mtl.R{transform:translateX(-100%);margin-left:6px}
.ms .mtl.sdk{color:var(--sd);font-weight:700}.ms .mtl.mee{color:var(--brand);font-weight:700}
.ms input[type=range]{-webkit-appearance:none;appearance:none;position:absolute;left:0;right:0;top:-7px;width:100%;height:18px;margin:0;background:transparent;z-index:3;cursor:pointer}
.ms input[type=range]::-webkit-slider-runnable-track{height:18px;background:transparent}
.ms input[type=range]::-moz-range-track{height:18px;background:transparent}
.ms input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--c);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.ms input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--c);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.ms input[type=range]:focus{outline:none}
.ms input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px rgba(230,70,127,.25)}
.ms.sd input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px rgba(0,121,107,.25)}
.aprules .ctl .ms{flex:1;width:100%}
.ms .ends{display:flex;justify-content:space-between;font:500 13px var(--font);color:#3A3F4E;margin-top:12px}
.pop.mee{width:470px}
.pop .ptitle{font-weight:600;font-size:13px;letter-spacing:.04em;color:#3A3F4E;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px}
.pop .prow{display:flex;gap:16px;align-items:flex-start}
.pop .pnum{flex:0 0 96px}
.pop .pnum input{width:100%;border:1px solid #9AA0AE;border-radius:4px;padding:8px 10px;font:500 16px var(--font)}
.pop .pslide{flex:1;min-width:0}
.pop .msg{display:flex;gap:8px;align-items:flex-start}
.pop .msg .mi{flex:0 0 18px;height:18px;border-radius:50%;color:#fff;font-size:11px;line-height:18px;text-align:center;font-weight:700}
.pop .msg.good{background:#E7F6EF;color:#1F3A2C}.pop .msg.good .mi{background:#1E9E5A}
.pop .msg.meh .mi{background:var(--warn)}.pop .msg.bad .mi{background:var(--loss)}
.pop .btn.pupd{background:var(--brand);color:#fff;border-color:var(--brand)}
@media (max-width:640px){.pop.mee{width:100%}.pop .prow{flex-direction:column}.pop .pnum{flex:none;width:120px}.pop .pslide{width:100%}}
.pb-in{position:relative;height:122px}
.pb-bar{position:absolute;left:0;right:0;top:52px;height:26px;border-radius:13px;overflow:hidden;background:#fff}
.pb-seg{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden}
.pb-seg.loss{background:#F6C6C1;color:#9B1C1C}.pb-seg.low{background:#FFE3A3;color:#8A5300}.pb-seg.safe{background:#BFE5C8;color:#1B5E20}
.pb-pin{position:absolute;top:0;width:0;display:flex;flex-direction:column;align-items:center;z-index:2}
.pb-pin.edgeL{align-items:flex-start}.pb-pin.edgeR{align-items:flex-end}
.pb-pin span{font-size:12.5px;font-weight:700;padding:3px 8px;border-radius:5px;white-space:nowrap;color:#fff}
.pb-pin.edgeL span{margin-left:-4px}.pb-pin.edgeR span{margin-right:-4px}
.pb-pin::after{content:"";width:3px;height:56px;border-radius:2px;margin-top:-1px;align-self:center}
.pb-pin.row2{top:26px}.pb-pin.row2::after{height:30px}
.pb-pin.you span{background:var(--ink)}.pb-pin.you::after{background:var(--ink)}
.pb-pin.sug span{background:var(--sd)}.pb-pin.sug::after{background:var(--sd)}
.pb-pin.mee span{background:#3949AB}.pb-pin.mee::after{background:#3949AB}
.pop-band{margin:4px 0 0}.pop-band .pb-key{display:none}.pop-band .pb-pin span{font-size:12px;padding:2px 6px}
.pb-buy{position:absolute;top:86px;border-top:3px solid #8E6FCF;display:flex;justify-content:center}
.pb-buy.r{justify-content:flex-end}.pb-buy.l{justify-content:flex-start}
.pb-buy span{display:inline-block;font-size:12px;color:#5E4499;font-weight:600;margin-top:3px;white-space:nowrap}
@media (max-width:640px){.pb-seg{font-size:0}}
.pb-key{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--muted);margin-top:2px}
.pb-key i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.pb-key i.loss{background:#F6C6C1}.pb-key i.low{background:#FFE3A3}.pb-key i.safe{background:#BFE5C8}
.sd-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.viab{margin-top:10px;font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
details.math{margin-top:14px;border-top:1px solid var(--sd-line);padding-top:10px}
details.math summary{cursor:pointer;color:var(--sd);font-weight:500}
.mgrid{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:18px;margin-top:12px}
.row{display:grid;grid-template-columns:1fr 104px;gap:8px;align-items:center;margin-bottom:6px;font-size:13px}
.row small{display:block;color:var(--muted);font-size:11.5px;line-height:1.2}
.row input,.row select{width:100%;border:1px solid var(--sd-line);border-radius:4px;padding:5px 7px;font:500 13px var(--mono);text-align:right;background:#fff}
.funnel{display:grid;gap:5px}
.frow{display:grid;grid-template-columns:78px 1fr 34px;gap:8px;align-items:center;font-size:13px}
.fbar{height:16px;border-radius:3px;background:#C7BCE0}.fbar.k{background:var(--sd)}
.stack{display:flex;height:22px;border-radius:5px;overflow:hidden;margin-top:12px}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:4px 14px;margin-top:8px;font-size:12.5px}
.legend div{display:flex;gap:6px;align-items:center}.legend i{width:10px;height:10px;border-radius:2px;flex:none}.legend .num{margin-left:auto}
.formula{margin-top:10px;font:12px/1.5 var(--mono);color:var(--muted);background:#fff;border-radius:6px;padding:8px 10px;white-space:normal;overflow-wrap:anywhere}
.sizes{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px}
.sizes th{background:var(--soft);text-align:left;font-weight:500;padding:8px}
.sizes td{padding:8px;border-top:1px solid var(--line)}
.sizes input{width:80px;border:1px solid #CBD0DC;border-radius:4px;padding:4px 6px}
.imgbox{display:flex;gap:10px;margin-top:12px}
.imgbox div{width:96px;height:110px;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;font-size:12px;color:var(--muted);text-align:center}
.guide{background:#F3F1FB;border-radius:6px;padding:10px;font-size:12px}
.footbar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-top:12px}

/* price rec table */
.banner{background:#EEF0FB;color:#303F9F;border-radius:6px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:8px}
table.pr{border-collapse:collapse;width:100%;min-width:760px}
table.pr th{text-align:left;font-weight:500;padding:12px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:bottom}
table.pr th small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
table.pr td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
table.pr .rec{background:#EEF0FB}
table.pr .sdc{background:var(--sd-soft);border-left:1.5px solid var(--sd-line);border-right:1.5px solid var(--sd-line)}
table.pr th.sdc{color:var(--sd)}
.pname a{color:#1E4DB7;font-weight:500;text-decoration:none}
.pname small{display:block;color:var(--muted)}
.price{font-size:15px}
.settle{font-size:12px;color:var(--muted);margin-top:4px}
.rec .settle{color:#3949AB}
.act{display:flex;flex-direction:column;gap:6px;min-width:170px}
.act .pin{display:flex;border:1px solid #CBD0DC;border-radius:4px;overflow:hidden}
.act .pin input{border:0;padding:6px 8px;width:100%;font:500 13px var(--mono)}
.act .pin button{border:0;background:#fff;border-left:1px solid #CBD0DC;cursor:pointer;padding:0 8px}
.pop{position:static;margin-top:4px;background:#fff;border:1px solid var(--line);box-shadow:0 8px 30px rgba(20,25,40,.18);border-radius:8px;padding:14px;width:340px;max-width:100%}
.pop .scale{position:relative;height:32px}
.pop .scale span{position:absolute;transform:translateX(-50%);font:11px var(--mono);color:var(--muted)}
.pop .msg{margin-top:10px;border-radius:6px;padding:8px 10px;font-size:13px}
.cwarn{margin-top:6px;font-size:12.5px;color:var(--warn);line-height:1.35}
.pop .msg.bad{background:var(--loss-soft);color:var(--loss)} .pop .msg.good{background:var(--gain-soft);color:var(--gain)} .pop .msg.meh{background:var(--warn-soft);color:var(--warn)}
.pop .row2{display:flex;justify-content:space-between;gap:8px;margin-top:12px}
.flowtrack{position:relative;height:10px;margin:6px 0 2px;border-radius:5px;background:#eee;overflow:hidden}
.flowtrack .lz{position:absolute;left:0;top:0;bottom:0;background:#F7C9C4}
.flowtrack .bz{position:absolute;top:0;bottom:0;background:#C9BCE6}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1F2433;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.25)}

/* quality */
.qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 40px}
.reason h4{margin:0;font-size:15px;font-weight:500}
.reason small{color:var(--muted)}
.reason .tip{background:#FDEBDC;border-radius:4px;padding:8px 10px;font-size:13px;margin-top:6px}
.ratings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.ratings>div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px}
.ratings .v{font-size:22px;font-weight:700}

.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.qcatsel{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qcatsel select{border:1px solid #CBD0DC;border-radius:6px;padding:6px 10px;font:600 14px var(--font);color:var(--ink);background:#fff}
.qseg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.qseg button{border:0;background:none;padding:7px 12px;font:500 13px var(--font);color:var(--muted);cursor:pointer}
.qseg button[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand)}
.qcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.qcards>div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.qcards .v{font-size:22px;font-weight:700}.qcards .v small{font-size:13px;color:var(--muted);font-weight:500}
.sm{font-size:12px}
.qtwo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px}
.qh{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.qchart{width:100%;height:auto;display:block;margin-top:8px}
.qpie{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:12px;align-items:center;margin:8px 0}
.qdonut{width:100%;max-width:190px;height:auto;display:block}
.qdonut path:focus{outline:none;stroke:#1F2433;stroke-width:2}
.qleg{display:grid;gap:4px}
.qli{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;background:#fff;border:1px solid transparent;border-radius:6px;padding:6px 8px;font:13.5px var(--font);color:var(--ink);cursor:pointer}
.qli i{width:12px;height:12px;border-radius:3px}.qli small{display:block;color:var(--muted);font-size:11.5px}
.qli[aria-pressed="true"]{border-color:var(--line);background:var(--soft);font-weight:600}
.qli.off{cursor:default;color:var(--muted)}
.hi-sub{font-size:12.5px;color:var(--sd);margin-top:2px}

<script>
(function(){
const $=id=>document.getElementById(id);
const inr=v=>(v<0?'−':'')+'₹'+Math.round(Math.abs(v)).toLocaleString('en-IN');
const amt=v=>inr(Math.abs(v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastT;function toast(t){let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';document.body.appendChild(el);}el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2600);}

/* ================= ENGINE ================= */
const SLABS=[{fwd:56,rev:160},{fwd:80,rev:190}]; // deck slide 5: ₹56 catalogue shipping charge, ₹160 return (GST inside); >500 g slab estimated
function econ(p,x,units){
  /* Exactly the deck (slide 5).
     Floor (five-line napkin) = (stock that stays sold + damaged returns + packing on every parcel + 18% GST on the shipping charge
                                 + return shipping + ads + product GST + target profit) ÷ parcels that stay sold
     Break-even, real profit per order and max return rate (the three numbers she never sees) count sales and product cost
     on every DELIVERED order, as the slide's P&L does. */
  units=units||1;
  const g=x.gst?(x.gstRate||5)/100:0, D=100, SHIP_GST=0.18, tgt=(x.target||0)*units, c=x.cost*units;
  const dl=D*(1-x.rto/100), rt=dl*x.ret/100, K=dl-rt, rto=D-dl, fail=D-K;
  const parts={goods:c*(K+x.uns/100*rt),pack:x.pack*D,fwd:0,rev:x.rev*rt,rtoShip:(x.rtoFee||0)*rto,shipGst:SHIP_GST*x.fwd*dl,ads:x.ads*D};
  const other=parts.pack+parts.rev+parts.rtoShip+parts.shipGst+parts.ads;
  const costDl=c*dl+c*x.uns/100*rt+other;                     // slide 5: 8,500 + 150 + 500 + 857 + 2,400
  const pnet=p/(1+g);
  const gstAmt=dl*p*g/(1+g);                                  // slide 6 P&L: GST paid to government (₹567)
  const base=parts.goods+other+tgt*K;                          // slide 6 napkin: ₹7,000 + ₹1,357 + ₹2,550 = ₹10,907
  const floor=Math.floor(base/K*(1+(x.gstRate>=12?g:0)));     // slide 6: ₹10,907 ÷ 70 = ₹155; GST-registered sellers (12%+) add product GST
  const breakEven=floor, real=p-floor;                         // team rule: profit per order = listed price − lowest safe price, nothing else
  const cost=Object.values(parts).reduce((a,b)=>a+b,0);
  return {g,dl,rt,K,rto,fail,parts,cost,costDl,gstAmt,profit:tgt*K,tgt,cpk:cost/K,breakEven,floor,pnet,contribKept:real,contribDisp:real};
}
const settle=(p,x)=>p/(x.gst?1+(x.gstRate||5)/100:1); // forward shipping is paid by the customer, on top of the price
const BINS=[[320,360,5],[360,400,11],[400,440,30],[440,480,32],[480,520,13],[520,560,6],[560,600,3]];
const ordersPer1k=(p,m)=>18*Math.pow(p/(450*(m||1)),-5);
const c1k=(p,x,m)=>ordersPer1k(p,m)*econ(p,x).contribDisp;
function optimum(x,m){m=m||1;let b=0,bv=-1e9;for(let p=Math.round(300*m);p<=Math.round(620*m);p++){const v=c1k(p,x,m);if(v>bv){bv=v;b=p;}}return b;}
function bandPos(p,m){m=m||1;let c=0;for(const[a,b,s]of BINS){const A=a*m,B=b*m;if(p>=B)c+=s;else if(p>A)c+=s*(p-A)/(B-A);}return c;}

/* ================= SELLERS ================= */
const x9=v=>{let r=Math.round((v+1)/10)*10-1;return r;};
const BAND=m=>({lo:400*m,hi:480*m,mid:440*m});
/* "At ₹320 you lose ₹X" or "At ₹320 you earn only ₹X, below your target" */
function atPrice(p,x,hi){const k=econ(p,x).contribKept;
  if(k<0)return hi?`₹${p} पर आपको हर ऑर्डर पर ${amt(k)} का नुकसान है।`:`At ₹${p} you lose ${amt(k)} per order.`;
  return hi?`₹${p} पर हर ऑर्डर पर ${inr(k)} बचते हैं।`:`At ₹${p} you earn ${inr(k)} per order.`;}
const x9up=fl=>{let v=Math.ceil(fl/10)*10-1;return v<fl?v+10:v;};
/* Deck slide 4 decision rule: where the floor sits against the band decides the entry price */
function launchRule(x,m){
  m=m||1;const fl=econ(0,x).floor,b=BAND(m);
  if(fl<b.lo) return {kind:'below',price:Math.max(x9(b.mid*1.045),fl),label:'Lowest safe price well below the band',msg:'Enter one step above the band’s centre. Headroom is easier to give away than to take back.'};
  if(fl<=b.hi){let p=x9(fl*1.03);if(p<fl)p+=10;return {kind:'inside',price:p,label:'Lowest safe price sits inside the band',msg:'Enter just above your lowest safe price, treat the first 50 orders as paid research, and review the price in 21 days.'};}
  return {kind:'above',price:null,label:'Lowest safe price sits above the band',msg:'Don’t solve this with a price. Change the product, packing, pack size or return policy.'};
}
/* Deck "three numbers she never sees": highest return rate this price survives */
/* deck: the highest failure rate (returns and RTO each at m per 100 parcels) at which this price still doesn't lose money (slide 5: 9.4%) */

const IB={cost:375,gst:true,gstRate:18,slab:0,fwd:56,rev:160,rto:15,ret:15,uns:10,pack:5,ads:40,cpc:2,conv:5,target:0,price:549};
const SELLERS={
 rekha:{key:'rekha',name:'Rekha Fashions',owner:'Rekha',av:'RF',color:'#7C4DAB',sub:'Kanpur · Kurtis',noun:'kurtis',
  facts:['Not GST registered','Age 47 · Kanpur','Kurti shop + Meesho','Lifecycle: Launch → Learn'],
  quote:'“Kurti ₹100 ki padti hai, ₹140 rakh diya. ₹40 toh bach hi jayenge.”',

/* Meesho-style slider. ticks: [{v,t,cls}] with cls 'mee' (Meesho, pink), 'sdk' (Sahi Daam, teal) or 'gry' */
function msHTML(o){
  const lo=o.lo,hi=o.hi,fmt=o.fmt||inr,f=v=>Math.max(0,Math.min(1,(v-lo)/(hi-lo)));
  const pos=v=>`left:calc(9px + (100% - 18px) * ${f(v).toFixed(4)})`;
  const tk=(o.ticks||[]).filter(t=>t.v>=lo&&t.v<=hi).sort((a,b)=>a.v-b.v);
  let prev=-1,up=false;tk.forEach(t=>{t.up=prev>=0&&f(t.v)-prev<0.24&&!tk[tk.indexOf(t)-1].up;if(t.up)up=true;prev=f(t.v);});
  const lab=tk.map(t=>`<i class="tk ${t.cls||''}" style="${pos(t.v)}"></i><span class="mtl ${t.cls||''}${t.up?' up':''}${f(t.v)<0.1?' L':f(t.v)>0.9?' R':''}" style="${pos(t.v)}">${t.t}</span>`).join('');
  return `<div class="ms${o.sd?' sd':''}${up?' r2':''}" style="--f:${f(o.val).toFixed(4)}"><div class="trk">${lab}<i class="tk end" style="${pos(lo)}"></i><i class="tk end" style="${pos(hi)}"></i>
    <input type="range" id="${o.id}" min="${lo}" max="${hi}" step="${o.step||1}" value="${o.val}" aria-label="${esc(o.aria||'Value')}"></div>
    <div class="ends num"><span>${fmt(lo)}</span><span>${fmt(hi)}</span></div></div>`;}
function msSync(id){const i=$(id);if(!i)return;const lo=+i.min,hi=+i.max;i.closest('.ms').style.setProperty('--f',Math.max(0,Math.min(1,(+i.value-lo)/(hi-lo))).toFixed(4));}
function bandBar(p,fl,m,sug,be,o){
  o=o||{};m=m||1;const B=BAND(m);let lo=Math.min(B.lo*0.62,be*0.78,p*0.85),hi=Math.max(B.hi*1.12,p*1.06,(sug||0)*1.06);
  if(o.range){[lo,hi]=o.range;}   // the price popover passes the slider's own range so the pin sits under the thumb
  const T=o.short?['✗ Loss','! Low','✓ Safe']:['✗ You lose money','! Low','✓ Safe'],sl=o.sugLabel||'Suggested',yl=o.youLabel===undefined?'Your price ':o.youLabel;
  const pc=v=>Math.max(0,Math.min(100,(v-lo)/(hi-lo)*100)),w=(a,b)=>Math.max(0,pc(b)-pc(a));
  const seg=(a,b,cls,txt)=>`<div class="pb-seg ${cls}" style="left:${pc(a)}%;width:${w(a,b)}%">${w(a,b)>11?txt:''}</div>`;
  const pin=(v,cls,txt)=>`<div class="pb-pin ${cls}${pc(v)<15?' edgeL':pc(v)>85?' edgeR':''}" style="left:${pc(v)}%"><span>${txt}</span></div>`;
  const same=sug&&Math.abs(sug-p)<1,near=sug&&!same&&Math.abs(pc(sug)-pc(p))<40;
  let h=`<div class="pb-in"><div class="pb-bar">${seg(lo,be,'loss',T[0])}${seg(be,fl,'low',T[1])}${seg(fl,hi,'safe',T[2])}</div>`;
  h+=pin(p,'you',same?`${yl}${inr(p)} = ${sl}`:`${yl}${inr(p)}`);
  if(sug&&!same)h+=pin(sug,(o.sugCls||'sug')+(near?' row2':''),`${sl} ${inr(sug)}`);
  h+=`<div class="pb-buy${pc(B.hi)>70?' r':pc(B.lo)<30?' l':''}" style="left:${pc(B.lo)}%;width:${w(B.lo,B.hi)}%"><span>${o.short?'Most buyers':'Most buyers pay'} ${inr(B.lo)}–${inr(B.hi)}</span></div>`;
  return h+`</div><div class="pb-key"><span><i class="loss"></i>You lose money</span>${fl>be?'<span><i class="low"></i>You keep less than you want</span>':''}<span><i class="safe"></i>Safe</span>`;
}

function shipPanel(CAT,e,p){

   <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:6px">

/* ---- mentor feedback 2b: lower the cost before raising the price ---- */
function cutPanel(CAT){
  const base=econ(0,CAT).floor,L=[];
  const add=(label,how,x)=>{const f=econ(0,{...CAT,...x}).floor;if(base-f>0)L.push([label,how,base-f,f]);};
  if(CAT.slab===1)add('Pack under 500 g','Lighter packing moves you to the cheaper weight slab',{slab:0,fwd:SLABS[0].fwd,rev:SLABS[0].rev});
  add('Buy 5% cheaper','Bulk order or a second supplier',{cost:CAT.cost*0.95});
  add('Cut returns by 5 points',D().key==='imran'?'Test every unit before dispatch':'Size chart, true-colour photos',{ret:Math.max(0,CAT.ret-5)});
  add('Cut RTO by 5 points','Confirm COD orders before dispatch',{rto:Math.max(0,CAT.rto-5)});
  add('Cheaper packaging','Bulk polybags (₹2–4 instead of ₹3–6) and labels',{pack:Math.max(0,CAT.pack-2)});
  if(CAT.ads>0)add('Halve ad spend','Once over 30% of orders come without ads',{ads:CAT.ads/2});
  L.sort((a,b)=>b[2]-a[2]);
  const all=econ(0,{...CAT,cost:CAT.cost*0.95,ret:Math.max(0,CAT.ret-5),rto:Math.max(0,CAT.rto-5),pack:Math.max(0,CAT.pack-2),ads:CAT.ads/2,...(CAT.slab===1?{slab:0,fwd:SLABS[0].fwd,rev:SLABS[0].rev}:{})}).floor;
  return `<h4>Cut your costs before you raise your price</h4>
   <div class="sub">A higher price can push buyers away; a lower cost never does. Each change below lowers your lowest safe price.</div>
   <div class="mtw"><table class="mt"><thead><tr><th>Change</th><th>How</th><th class="n">Safe price drops by</th><th class="n">New lowest safe price</th></tr></thead><tbody>
   ${L.map(r=>`<tr><td><b>${r[0]}</b></td><td class="muted">${r[1]}</td><td class="n" style="color:var(--gain)">−${inr(r[2])}</td><td class="n">${inr(r[3])}</td></tr>`).join('')}
   <tr><td><b>All of the above</b></td><td></td><td class="n" style="color:var(--gain)"><b>−${inr(base-all)}</b></td><td class="n"><b>${inr(all)}</b></td></tr></tbody></table></div>`;
}

    return {label,ret,rating,safe:e.floor,earn:e.contribKept,orders,p1k:orders*e.contribDisp};};
  const T=scen('Today',now.ret,r0),F=scen('Fix “'+Q.reasons[st.sel][0]+'”',now.ret*(1-share/100),r0+0.2*share/top),
        C=scen('Same returns as other sellers',Q.catNorm.ret,Math.max(r0,4.0));
  const retCost=econ(p,now).cpk-econ(p,{...now,ret:0}).cpk;
  const other=Math.max(0,100-Q.reasons.reduce((a,r)=>a+r[1],0));

function earnLine(k,t,hi){

}

function donutSVG(items,sel,center){

    const P=(rad,ang)=>(cx+dx+rad*Math.cos(ang)).toFixed(2)+' '+(cy+dy+rad*Math.sin(ang)).toFixed(2),L=a1-a0>Math.PI?1:0;

const apBase=S=>({...S.base,...(S.ap.target!=null?{target:S.ap.target}:{})});
const apPrice=(S,i)=>S.ap.accepted[i]?S.events[i].after:S.events[i].price;
function signals(i){
  const S=D(),ev=S.events[i],x=evX(i),price=apPrice(S,i),e=econ(price,x),m=ev.m,pos=bandPos(price,S.cat.m);
  const P=(c,t)=>`<span class="pill ${c}">${t}</span>`,OK=P('ok','✓ Fine'),W=P('watch','! Watch'),A=P('loss','✗ Act now'),NA=P('na','— Not yet');
  const vs=m.avgLabel?`vs ${m.avg} for similar products`:`vs your usual ${m.avg}`;
  return [
   ['People who saw your product',m.views===null?'new listing':(m.views>0?'+':'−')+Math.abs(m.views)+'% vs last week','drops by more than 30% in a week',m.views===null?NA:(m.views<=-30&&!m.season)?A:m.views<=-15?W:OK],
   ['Of those, how many bought',m.vo===null?'no data yet':m.vo+'% of similar products','below 60% of similar products for 7 days',m.vo===null?NA:m.vo<60?A:m.vo<80?W:OK],
   ['Profit per order (price − lowest safe price)',inr(e.contribKept),'below ₹0',e.contribKept<0?A:OK],
   ['Parcels that came back (out of 100)',m.fail===null?'no data yet':Math.round(m.fail)+' '+vs,'5 or more above normal',m.fail===null?NA:(m.fail-m.avg>=5)?A:(m.fail-m.avg>3)?W:OK],
   ['Is your price normal for this product?',pos<25?'cheaper than most':pos>75?'costlier than most':'in the normal range','cheaper or costlier than most sellers',(pos<25||pos>75)?W:OK],
   ['Your costs (shipping, fees, tax)',m.costNew||'no change','any cost changes',m.costNew==='first listing'?P('ok','✓ Worked out'):m.costNew?P('watch','↻ Re-checked'):OK]
  ];
}
function renderAutopilot(sc){
  const S=D(),A=S.ap,b=apBase(S),fl=econ(0,b).floor,tg=b.target||0;
  sc.innerHTML=`<div class="sd-box" style="margin-bottom:14px">
    <span class="sd-badge">Sahi Daam Autopilot · ${esc(S.apCatalog)}</span>
    <div class="hi-sub">आपका दाम, आपकी शर्तों पर · हफ़्ते में ज़्यादा से ज़्यादा एक WhatsApp</div>
    <div class="muted sm" style="margin-top:2px">Meesho already sends order alerts on WhatsApp. Sahi Daam adds one pricing tip a week. Set your rules here:</div>
    <div class="aprules">
      <div class="rc"><div class="lbl">Lowest safe price</div><div class="num big" id="ap-fl">${inr(fl)}</div>
        <div class="ctl"><span class="pill ok">Worked out for you</span></div>
        <div class="muted sm">Never goes below this. Updates when your costs change.</div></div>
      <div class="rc"><div class="lbl">Highest price to try</div><div class="num big" id="ap-ce-v">₹${S.ceiling}</div>
        <div class="ctl">${msHTML({id:'ap-ce',lo:Math.ceil((fl+30)/10)*10,hi:Math.round(S.cat.mrp*0.75/10)*10,val:S.ceiling,step:10,sd:true,aria:'Highest price'})}</div>
        <div class="muted sm">सबसे ऊँचा दाम जो आज़माया जा सकता है</div></div>
      <div class="rc"><div class="lbl">Change my price</div><div class="big">${A.auto?'Automatic':'Ask me first'}</div>
        <div class="ctl"><div class="qseg ap-mode" role="group" aria-label="Who changes the price"><button data-mode="ask" aria-pressed="${!A.auto}">Ask me first</button><button data-mode="auto" aria-pressed="${!!A.auto}">Do it for me</button></div></div>
        <div class="muted sm">${A.auto?'Changes inside your range, then tells you. Undo any time.':'Nothing changes until you tap the WhatsApp button.'}</div></div>
    </div></div>
  <div class="ap">
    <div class="phone"><div class="scr">
      <div class="wa"><div class="av">SD</div><div><b>Sahi Daam</b><small>Meesho Supplier · verified</small></div>
        <div class="lang" role="group" aria-label="Language"><button id="l-en" aria-pressed="${lang==='en'}">EN</button><button id="l-hi" aria-pressed="${lang==='hi'}">हिं</button></div></div>
      <div class="msgs" id="msgs" aria-live="polite"></div></div>
      <div class="muted sm" style="color:#cfd3dc;text-align:center;padding:6px 0 2px">Tap the green button to reply</div></div>
    <div>
      <div class="timeline" id="timeline"></div>
      <div class="card" style="margin-top:12px">
        <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
          <div><span class="lbl">Stage</span><div style="margin-top:4px"><span class="stage" id="ap-stage"></span> <b id="ap-job"></b></div><div class="hi-sub" id="ap-job-hi"></div></div>
          <div style="text-align:right"><span class="lbl">Price on Meesho now</span><div class="num" style="font-size:22px" id="ap-price"></div><div class="sm" id="ap-earn"></div></div>
        </div>
        <div style="margin-top:12px"><span class="lbl" id="ap-when"></span><div style="font-size:15px" id="ap-what"></div></div>
        <div class="rule" id="ap-rule"></div>
        <details class="apdeck"><summary>Deck rule behind this tip (for judges)</summary><div id="ap-deck"></div></details>
        <div class="apnext"><button class="btn sd" id="ap-next">Next event →</button><span class="muted sm" id="ap-hint"></span></div>
      </div>
      <div class="card" style="margin-top:12px">
        <h3 class="qh">6 things Sahi Daam watches every week</h3>
        <div style="overflow-x:auto"><table class="sig"><thead><tr><th>What we watch</th><th>Now</th><th>We send a tip when…</th><th>Status</th></tr></thead><tbody id="sig"></tbody></table></div>
      </div>
    </div>
  </div>`;
  $('l-en').onclick=()=>{lang='en';renderAutopilot(sc);};$('l-hi').onclick=()=>{lang='hi';renderAutopilot(sc);};
  $('ap-next').onclick=()=>{const a=D().ap,n=D().events.length;if(a.cur<a.reached)a.cur++;else if(a.accepted[a.reached]&&a.reached<n-1){a.reached++;a.cur=a.reached;}drawAP();};
  $('ap-ce').oninput=ev=>{S.ceiling=+ev.target.value;msSync('ap-ce');$('ap-ce-v').textContent='₹'+S.ceiling;drawAP();};
  sc.querySelectorAll('[data-mode]').forEach(bn=>bn.onclick=()=>{A.auto=bn.dataset.mode==='auto';toast(A.auto?'Autopilot will change prices inside your range and tell you.':'Autopilot will ask you before every change.');renderAutopilot(sc);});
  drawAP();
}
function drawAP(){
  const S=D(),A=S.ap,EV=S.events,ev=EV[A.cur],x=evX(A.cur),price=apPrice(S,A.cur),e=econ(price,x),sp=STAGE_P[ev.stage];
  $('ap-stage').textContent=sp[0].toUpperCase();$('ap-job').textContent=sp[1];$('ap-job-hi').textContent=sp[2];$('ap-price').textContent=inr(price);
  const k=e.contribKept,tg=x.target||0;$('ap-earn').innerHTML=k<0?`<span style="color:var(--loss)">✗ you lose ${amt(k)} per order</span>`:k<tg?`<span style="color:var(--warn)">! you keep only ${inr(k)} per order</span>`:`<span style="color:var(--gain)">✓ you keep ${inr(k)} per order</span>`;
  const nm=(EV_NAME[S.key]||[])[A.cur]||ev.name;
  $('ap-when').textContent=`${ev.d} · ${ev.date} · ${nm}`;$('ap-what').textContent=ev.what;
  $('ap-rule').innerHTML='<b>Why this tip:</b> '+plainWhy(S,A.cur);
  $('ap-deck').innerHTML=ev.rule+` <span class="muted">(Deck stage: ${ev.stage}, ${STAGES[ev.stage]}.)</span>`;
  $('sig').innerHTML=signals(A.cur).map(r=>`<tr><td>${r[0]}</td><td class="val">${r[1]}</td><td class="muted">${r[2]}</td><td>${r[3]}</td></tr>`).join('');
  const nb=$('ap-next');const canNext=A.cur<A.reached||(A.accepted[A.reached]&&A.reached<EV.length-1);
  const done=A.reached===EV.length-1&&A.accepted[A.reached];nb.hidden=!canNext;$('ap-hint').innerHTML=canNext?'':done?'<b style="color:var(--gain)">✓ Journey complete.</b> Tap any day above to look back.':'← Tap the green button in WhatsApp to reply. The next event opens after that.';
  $('timeline').innerHTML=EV.map((v,i)=>`<button class="tl ${A.accepted[i]?'done':''}" ${i===A.cur?'aria-current="step"':''} ${i>A.reached?'disabled':''} data-i="${i}"><div class="d">${v.d} · ${v.date}</div><div class="n">${esc((EV_NAME[S.key]||[])[i]||v.name)}</div></button>`).join('');
  $('timeline').querySelectorAll('.tl').forEach(b=>b.onclick=()=>{A.cur=+b.dataset.i;drawAP();});
  let h='';
  for(let i=0;i<=A.reached;i++){const v=EV[i],xi=evX(i),t=S.T(i,xi,econ(v.price,xi).floor);
    h+=`<div class="day">${v.d} · ${v.date}</div>`;
    if(i===0)h+=`<div class="b me">${S.first[lang]}<span class="t">10:02</span></div>`;
    t[lang].forEach(([cl,tx])=>h+=`<div class="b ${cl}">${tx}<span class="t">10:0${i+3}</span></div>`);
    if(A.accepted[i]){h+=`<div class="b me">${t.cta[lang]}<span class="t">10:1${i}</span></div><div class="b">${t.reply[lang]}<span class="t">10:1${i}</span></div>`;if(i===A.reached)h+=`<button class="undo" data-undo="${i}">${lang==='en'?'Undo':'पहले जैसा करें'}</button>`;}
    else if(i===A.reached){
      if(A.auto&&v.after!==v.price)h+=`<div class="b good">${lang==='en'?`Auto mode is on: we will change the price to ₹${v.after} unless you reply STOP.`:`ऑटो मोड चालू है: अगर आप STOP नहीं भेजते तो हम दाम ₹${v.after} कर देंगे।`}<span class="t">10:0${i+4}</span></div>`;
      h+=`<button class="cta" data-cta="${i}">${t.cta[lang]}</button>`;}}
  const box=$('msgs');box.innerHTML=h;box.scrollTop=box.scrollHeight;
  box.querySelectorAll('[data-cta]').forEach(b=>b.onclick=()=>{A.accepted[+b.dataset.cta]=true;A.cur=+b.dataset.cta;drawAP();});
  box.querySelectorAll('[data-undo]').forEach(b=>b.onclick=()=>{A.accepted[+b.dataset.undo]=false;A.cur=+b.dataset.undo;drawAP();});
}

/* ================= SETTINGS ================= */

  if(s==='ads'&&D().base.gst)use=`You pay only for clicks, but not every click buys. Ad cost per order = cost per click ÷ share of clicks that buy (₹2 ÷ 5% = ₹40). That ₹40 goes into ${D().owner}’s lowest safe price. Once more than 30% of orders arrive without ads, Sahi Daam suggests cutting spend before touching price.`;
  $('screen').innerHTML=`<div class="ph"><div class="card"><h2>${t}</h2><p class="muted" style="margin:0">${what}</p></div>

    <p class="muted" style="font-size:13px">This screen is not built in the prototype.</p></div>`;
}
function renderAbout(sc){
  sc.innerHTML=`<div class="card" style="margin-bottom:14px;border-color:#CFC3EE"><h2>What changed after review, and where it is in the prototype</h2><ul class="clean">
      <li><b>Forward shipping is not the seller’s cost:</b> the customer pays it on delivered orders. The seller still pays 18% GST on it (deck, slide 5).</li>
      <li><b>RTO:</b> the product always comes back, so only customer returns can be unsellable (about 1 in 10, deck). Shipping on RTO follows the deck: Meesho’s stated policy is no charge.</li>
      <li><b>TDS and TCS:</b> left out of the floor (refundable). GST kept at a small assumed rate.</li>
      <li><b>Who bears shipping?</b> Catalog Upload shows what the customer pays at checkout and what the seller pays (return charges and GST on delivery).</li>
      <li><b>Launching at a thin margin:</b> Catalog Upload lists the competitors to check, and shows how to lower the floor through cost before raising the price.</li>
      <li><b>Quality and profit:</b> Quality Dashboard shows how fixing the top return reason changes floor, orders and profit per 1,000 views.</li></ul></div>`+`<div class="engines">
    <div class="card"><h2>1 · Floor engine</h2><dl><dt>Where</dt><dd>Catalog Upload, next to Meesho Price</dd><dt>Inputs</dt><dd>Purchase cost and GST from the seller; shipping, RTO and return rates from Meesho</dd><dt>Prototype</dt><dd><span class="pill ok">Real math</span> Deck formula: (product + packaging + shipping + GST on shipping + ads + target profit) ÷ parcels that stay sold. Rekha’s ₹185 kurti: break-even ₹368, floor ₹388 with ₹20 profit</dd></dl></div>
    <div class="card"><h2>2 · Band engine</h2><dl><dt>Where</dt><dd>Catalog Upload band bar; Price Recommendation slider</dd><dt>Inputs</dt><dd>Orders by price for look-alike catalogs, last 30 days</dd><dt>Prototype</dt><dd><span class="pill watch">Simulated</span> One demand curve per category (kurtis, earbuds, chargers…), elasticity 5</dd></dl></div>
    <div class="card"><h2>3 · Autopilot</h2><dl><dt>Where</dt><dd>New Autopilot page; WhatsApp settings</dd><dt>Inputs</dt><dd>Six signals from Orders, Returns, Quality Dashboard, Payments</dd><dt>Prototype</dt><dd><span class="pill ok">Real rules</span> Deck slide 3 thresholds; scripted events per seller</dd></dl></div>
  </div>
  <div class="two">
    <div class="card"><h2>What we learned from the Supplier Panel</h2><ul class="clean">
      <li>RTO orders are not charged to the seller; customer returns pay return shipping. The floor already models this.</li>

      <li>Quality Dashboard already shows rating, return rate and top return reasons with tips. We add what returns cost in rupees, a “fix this reason” what-if, a returns slider and a profit chart.</li></ul></div>
    <div class="card"><h2>Still to confirm</h2><ul class="clean">
      <li>Exact shipping per weight slab, and what else is in the settlement deduction (the tutorial shows about ₹90–100 between price and settlement).</li>
      <li>Is GST included in Meesho Price or added on top?</li>
      <li>Can a prototype read real cluster order data, or should it stay simulated?</li></ul></div>
  </div>`;
}
