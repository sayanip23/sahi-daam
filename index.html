<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sahi Daam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500&family=Mukta:wght@400;600&display=swap">
<style>
/* Deliberately single light theme: this mimics a light seller dashboard. */
:root{
  color-scheme:light;
  --bg:#F4F5F9; --card:#FFFFFF; --ink:#1F2433; --muted:#6B7185; --line:#E4E6ED; --soft:#F7F8FB;
  --side:#1E2A3B; --side-ink:#C9D0DC; --side-hi:#2D3B52;
  --brand:#E6467F; --brand-soft:#FDE8F0; --blue:#3F51B5;
  --sd:#0B7A68; --sd-soft:#E2F3EF; --sd-line:#9BD3C7;
  --loss:#C62828; --loss-soft:#FDECEA; --gain:#2E7D32; --gain-soft:#E7F4E8; --warn:#B26A00; --warn-soft:#FFF4DD;
  --chat:#ECE6DE; --bubble:#fff; --bubble-warn:#FFF2C6; --bubble-good:#DCF5D0; --bubble-me:#D5F1E7;
  --font:"Roboto","Mukta",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Roboto Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;margin:0}
button{font-family:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--sd);outline-offset:2px}

/* concept ribbon */
.ribbon{background:#11172A;color:#E7EAF3;font-size:12.5px;padding:7px 16px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between}
.ribbon b{color:#fff}
.key{display:inline-flex;align-items:center;gap:6px}
.key i{width:12px;height:12px;border-radius:3px;background:var(--sd);display:inline-block}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100% - 32px)}
aside{background:var(--side);color:var(--side-ink);padding:14px 0 24px}
.store{display:flex;gap:10px;align-items:center;padding:6px 18px 16px;border-bottom:1px solid #2F3A5C;margin-bottom:8px}
.store .av{width:34px;height:34px;border-radius:50%;background:#3A4670;color:#fff;display:grid;place-items:center;font-weight:700}
.store b{color:#fff;display:block;font-size:14px}
.store small{font-size:12px}
nav.side button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--side-ink);text-align:left;padding:10px 18px;font-size:14px;cursor:pointer;border-left:3px solid transparent}
nav.side button:hover{background:var(--side-hi)}
nav.side button[aria-current="page"]{background:var(--side-hi);color:#fff;border-left-color:var(--brand)}
nav.side svg{width:16px;height:16px;flex:none;opacity:.85}
.tag{margin-left:auto;font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 6px;background:#fff;color:var(--brand)}
.tag.sd{background:var(--sd);color:#fff}
.tag.red{background:#E53935;color:#fff}
nav.side .sdrow{box-shadow:inset 0 0 0 1px rgba(155,211,199,.25)}

main{padding:0 16px 40px;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;margin:0 -16px 16px;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(20,30,50,.05)}
.topbar h1{color:var(--ink)}
.topbar h1{font-size:20px;font-weight:500;margin:0}
.topbar .right{display:flex;gap:14px;align-items:center;color:var(--muted);font-size:13px}
.screen{max-width:1180px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px}
.card h2{font-size:16px;font-weight:500;margin:0 0 10px}
.btn{border:0;border-radius:6px;padding:9px 16px;font-weight:500;font-size:14px;cursor:pointer}
.btn.brand{background:var(--brand);color:#fff}
.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
.btn.blue{background:var(--blue);color:#fff;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.btn.sd{background:var(--sd);color:#fff}
.btn.sd-ghost{background:#fff;color:var(--sd);border:1px solid var(--sd)}
.btn.green{background:#2BA84A;color:#fff}
.btn:disabled{opacity:.5;cursor:default}

/* Sahi Daam additions */
.sd-box{border:1.5px solid var(--sd-line);background:var(--sd-soft);border-radius:8px;padding:14px}
.sd-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--sd)}
.sd-badge::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--sd)}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.loss{background:var(--loss-soft);color:var(--loss)} .pill.gain,.pill.ok{background:var(--gain-soft);color:var(--gain)} .pill.watch{background:var(--warn-soft);color:var(--warn)} .pill.na{background:var(--soft);color:var(--muted)}

/* home */
.hello{font-size:22px;font-weight:500;margin:0 0 4px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}
.tile .big{font-size:28px;font-weight:700;margin:4px 0}
.tile p{margin:0 0 12px;color:var(--muted)}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}

/* catalog form */
.cat-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:0;background:#fff;border:1px solid var(--line);border-radius:8px}
.cat-main{padding:18px;border-right:1px solid var(--line);min-width:0}
.cat-side{padding:18px}
.cat-main h2,.cat-side h2{color:var(--brand);font-weight:500;font-size:16px;margin:0 0 12px}
.copy{background:#F3F1FB;border-radius:6px;padding:8px 10px;font-size:12.5px;margin-bottom:12px}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 16px}
.f label{display:block;font-size:13px;margin-bottom:4px}
.f label em{color:var(--brand);font-style:normal}
.f input,.f select{width:100%;border:1px solid #CBD0DC;border-radius:4px;padding:7px 9px;font:inherit;background:#fff;color:var(--ink)}
.f.price input{border-color:var(--ink);border-width:1.5px}
.f.sdf label{color:var(--sd);font-weight:500}
.f.sdf input{border-color:var(--sd-line);background:#F5FBF9}
.inline-floor{margin-top:6px;font-size:12.5px;line-height:1.35}
.sd-panel{margin-top:16px}
.sd-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.sd-head h3{margin:4px 0 0;font-size:20px;font-weight:700}
.sd-head h3 .fl{color:var(--sd)}
.sd-nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.sd-nums>div{background:#fff;border:1px solid var(--sd-line);border-radius:6px;padding:8px 10px}
.sd-nums .v{font:500 18px var(--mono)}
.sd-nums .l{font-size:12px;color:var(--muted);line-height:1.3}
.bandbar{position:relative;height:56px;margin-top:14px}
.bandbar .track{position:absolute;left:0;right:0;top:22px;height:12px;border-radius:6px;background:#fff;border:1px solid var(--sd-line);overflow:hidden}
.bandbar .busy{position:absolute;top:0;bottom:0;background:#B7A6D9}
.bandbar .lossz{position:absolute;top:0;bottom:0;left:0;background:repeating-linear-gradient(135deg,#F7C9C4 0 4px,#FDECEA 4px 8px)}
.bandbar .mk{position:absolute;top:14px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font:500 11.5px var(--mono);white-space:nowrap}
.bandbar .mk i{display:block;width:3px;height:28px;border-radius:2px}
.bandbar .ax{position:absolute;top:40px;font:11px var(--mono);color:var(--muted);transform:translateX(-50%)}
.sd-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
details.math{margin-top:14px;border-top:1px solid var(--sd-line);padding-top:10px}
details.math summary{cursor:pointer;color:var(--sd);font-weight:500}
.mgrid{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:18px;margin-top:12px}
.row{display:grid;grid-template-columns:1fr 104px;gap:8px;align-items:center;margin-bottom:6px;font-size:13px}
.row small{display:block;color:var(--muted);font-size:11.5px;line-height:1.2}
.row input,.row select{width:100%;border:1px solid var(--sd-line);border-radius:4px;padding:5px 7px;font:500 13px var(--mono);text-align:right;background:#fff}
.funnel{display:grid;gap:5px}
.frow{display:grid;grid-template-columns:78px 1fr 34px;gap:8px;align-items:center;font-size:13px}
.fbar{height:16px;border-radius:3px;background:#C7BCE0}.fbar.k{background:var(--sd)}
.stack{display:flex;height:22px;border-radius:5px;overflow:hidden;margin-top:12px}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:4px 14px;margin-top:8px;font-size:12.5px}
.legend div{display:flex;gap:6px;align-items:center}.legend i{width:10px;height:10px;border-radius:2px;flex:none}.legend .num{margin-left:auto}
.formula{margin-top:10px;font:12px var(--mono);color:var(--muted);background:#fff;border-radius:6px;padding:8px 10px;overflow-x:auto;white-space:nowrap}
.sizes{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px}
.sizes th{background:var(--soft);text-align:left;font-weight:500;padding:8px}
.sizes td{padding:8px;border-top:1px solid var(--line)}
.sizes input{width:80px;border:1px solid #CBD0DC;border-radius:4px;padding:4px 6px}
.imgbox{display:flex;gap:10px;margin-top:12px}
.imgbox div{width:96px;height:110px;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;font-size:12px;color:var(--muted);text-align:center}
.guide{background:#F3F1FB;border-radius:6px;padding:10px;font-size:12px}
.footbar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-top:12px}

/* price rec table */
.banner{background:#EEF0FB;color:#303F9F;border-radius:6px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:8px}
table.pr{border-collapse:collapse;width:100%;min-width:1040px}
table.pr th{text-align:left;font-weight:500;padding:12px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:bottom}
table.pr th small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
table.pr td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
table.pr .rec{background:#EEF0FB}
table.pr .sdc{background:var(--sd-soft);border-left:1.5px solid var(--sd-line);border-right:1.5px solid var(--sd-line)}
table.pr th.sdc{color:var(--sd)}
.pname a{color:#1E4DB7;font-weight:500;text-decoration:none}
.pname small{display:block;color:var(--muted)}
.price{font-size:15px}
.settle{font-size:12px;color:var(--muted);margin-top:4px}
.rec .settle{color:#3949AB}
.act{display:flex;flex-direction:column;gap:6px;min-width:170px}
.act .pin{display:flex;border:1px solid #CBD0DC;border-radius:4px;overflow:hidden}
.act .pin input{border:0;padding:6px 8px;width:100%;font:500 13px var(--mono)}
.act .pin button{border:0;background:#fff;border-left:1px solid #CBD0DC;cursor:pointer;padding:0 8px}
.pop{position:static;margin-top:4px;background:#fff;border:1px solid var(--line);box-shadow:0 8px 30px rgba(20,25,40,.18);border-radius:8px;padding:14px;width:320px}
.pop input[type=range]{width:100%;accent-color:var(--brand)}
.pop .scale{position:relative;height:32px}
.pop .scale span{position:absolute;transform:translateX(-50%);font:11px var(--mono);color:var(--muted)}
.pop .msg{margin-top:10px;border-radius:6px;padding:8px 10px;font-size:13px}
.pop .msg.bad{background:var(--loss-soft);color:var(--loss)} .pop .msg.good{background:var(--gain-soft);color:var(--gain)} .pop .msg.meh{background:var(--warn-soft);color:var(--warn)}
.pop .row2{display:flex;justify-content:space-between;gap:8px;margin-top:12px}
.flowtrack{position:relative;height:10px;margin:6px 0 2px;border-radius:5px;background:#eee;overflow:hidden}
.flowtrack .lz{position:absolute;left:0;top:0;bottom:0;background:#F7C9C4}
.flowtrack .bz{position:absolute;top:0;bottom:0;background:#C9BCE6}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1F2433;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.25)}

/* quality */
.qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 40px}
.reason h4{margin:0;font-size:15px;font-weight:500}
.reason small{color:var(--muted)}
.reason .tip{background:#FDEBDC;border-radius:4px;padding:8px 10px;font-size:13px;margin-top:6px}
.ratings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.ratings div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px}
.ratings .v{font-size:22px;font-weight:700}

/* autopilot */
.ap{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:18px;align-items:start}
.phone{background:#1b1720;border-radius:32px;padding:9px;max-width:330px;width:100%;margin:0 auto}
.scr{border-radius:24px;overflow:hidden;background:var(--chat);display:flex;flex-direction:column;height:580px}
.wa{background:#0B5D50;color:#fff;display:flex;align-items:center;gap:10px;padding:13px}
.wa .av{width:34px;height:34px;border-radius:50%;background:var(--sd);display:grid;place-items:center;font-weight:700;font-size:13px;border:2px solid #fff}
.wa b{display:block;font-size:15px;line-height:1.1}.wa small{opacity:.8;font-size:11.5px}
.lang{margin-left:auto;display:flex;border:1px solid rgba(255,255,255,.35);border-radius:7px;overflow:hidden}
.lang button{background:transparent;color:#fff;border:0;font:600 12px var(--font);padding:5px 8px;cursor:pointer;opacity:.7}
.lang button[aria-pressed="true"]{background:rgba(255,255,255,.2);opacity:1}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:7px}
.day{align-self:center;font-size:11.5px;background:#fff;color:var(--muted);padding:2px 10px;border-radius:8px;margin:6px 0 2px}
.b{max-width:88%;background:var(--bubble);border-radius:11px;padding:7px 10px;font-size:14px;line-height:1.4;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.b.warn{background:var(--bubble-warn)}.b.good{background:var(--bubble-good)}.b.me{align-self:flex-end;background:var(--bubble-me)}
.b .t{display:block;text-align:right;font-size:10.5px;color:var(--muted);margin-top:2px}
.cta{align-self:flex-end;background:#15935F;color:#fff;border:0;border-radius:999px;font-weight:700;font-size:13.5px;padding:8px 15px;cursor:pointer}
.undo{align-self:flex-end;font-size:12px;color:var(--sd);background:none;border:0;cursor:pointer;text-decoration:underline;padding:0}
.timeline{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px}
.tl{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.tl .d{font:500 11px var(--mono);color:var(--muted)}.tl .n{font-weight:500;font-size:13px;line-height:1.2}
.tl[aria-current="step"]{border-color:var(--sd);background:var(--sd-soft)}
.tl.done .n::after{content:" ✓";color:var(--gain)}
.tl:disabled{opacity:.45;cursor:default}
.stage{display:inline-block;font:500 12px var(--mono);letter-spacing:.06em;padding:4px 9px;border-radius:5px;background:var(--side);color:#fff}
.corr-track{position:relative;height:46px;margin-top:6px}
.corr-line{position:absolute;left:0;right:0;top:20px;height:4px;border-radius:2px;background:#E6E8EF}
.corr-zone{position:absolute;top:18px;height:8px;border-radius:4px;background:var(--sd);opacity:.35}
.corr-mark{position:absolute;top:8px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font:500 11.5px var(--mono);white-space:nowrap}
.corr-mark i{width:3px;height:28px;border-radius:2px;display:block}
table.sig{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
table.sig th{font-size:11.5px;text-align:left;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--line)}
table.sig td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.sig td.val{font-family:var(--mono);white-space:nowrap}
.rule{margin-top:12px;border-left:3px solid var(--sd);padding:6px 12px;background:var(--sd-soft);border-radius:0 6px 6px 0}
.lbl{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500}

/* settings + placeholder + about */
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.switch{width:42px;height:24px;border-radius:12px;background:#CBD0DC;border:0;position:relative;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked="true"]{background:#2BA84A}.switch[aria-checked="true"]::after{left:21px}
.switch.sdsw[aria-checked="true"]{background:var(--sd)}
.ph{display:grid;gap:12px;max-width:760px}
.ph .greyrow{height:44px;border-radius:6px;background:linear-gradient(90deg,#EDEFF4,#F6F7FA)}
.engines{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.engines dl{margin:8px 0 0;display:grid;gap:6px}.engines dt{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.engines dd{margin:0}
ul.clean{margin:8px 0 0;padding-left:18px}ul.clean li{margin:5px 0}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}

@media (max-width:1000px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside{padding:8px 0}
  .store{display:none}
  nav.side{display:flex;overflow-x:auto;gap:2px;padding:0 8px}
  nav.side button{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent;padding:9px 12px}
  nav.side button[aria-current="page"]{border-bottom-color:var(--brand)}
  .cat-wrap{grid-template-columns:minmax(0,1fr)}.cat-main{border-right:0;border-bottom:1px solid var(--line)}
  .ap,.mgrid{grid-template-columns:minmax(0,1fr)}
  .engines{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .fgrid,.tiles,.sd-nums,.qgrid,.ratings,.two{grid-template-columns:minmax(0,1fr)}
  .timeline{grid-template-columns:repeat(3,minmax(0,1fr))}
  .pop{width:280px}
}

/* seller switching */
.who{position:relative}
.who>button{background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;color:var(--ink);cursor:pointer}
.who-menu{position:absolute;right:0;top:38px;z-index:20;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(20,25,40,.18);width:260px;padding:6px}
.who-menu button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:8px;cursor:pointer;color:var(--ink);font-size:13.5px}
.who-menu button:hover,.who-menu button[aria-checked="true"]{background:var(--soft)}
.who-menu small{display:block;color:var(--muted);font-size:12px}
.who-menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.mini-av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none}
.choose{max-width:880px}
.choose h2{font-size:22px;font-weight:500;margin:0 0 4px}
.sellers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.seller{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px}
.seller .top{display:flex;gap:12px;align-items:center}
.seller .big-av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px}
.seller h3{margin:0;font-size:18px;font-weight:500}
.seller .facts{display:flex;flex-wrap:wrap;gap:6px}
.seller .facts span{font-size:12px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.seller blockquote{margin:0;border-left:3px solid var(--line);padding:2px 10px;color:var(--muted);font-style:italic}

function bandBar(p,fl,m,opt){
  m=m||1;const lo=300*m,hi=620*m,pc=v=>Math.max(0,Math.min(100,(v-lo)/(hi-lo)*100));
  let h=`<div class="track"><div class="lossz" style="width:${pc(fl)}%"></div><div class="busy" style="left:${pc(400*m)}%;width:${pc(480*m)-pc(400*m)}%"></div></div>`;
  h+=`<div class="mk" style="left:${pc(fl)}%;color:var(--loss)"><i style="background:var(--loss)"></i></div>`;
  if(opt)h+=`<div class="mk" style="left:${pc(opt)}%;color:var(--sd)"><i style="background:var(--sd);opacity:.5"></i></div>`;
  h+=`<div class="mk" style="left:${pc(p)}%;top:6px"><i style="background:var(--ink);width:4px;height:36px"></i></div>`;
  [400,480].forEach(v=>h+=`<span class="ax" style="left:${pc(v*m)}%">${inr(v*m)}</span>`);
  return h;
}

  }).join('');
  document.querySelectorAll('[data-pop]').forEach(b=>b.onclick=()=>{openPop=openPop===b.dataset.pop?null:b.dataset.pop;drawPR();});
  document.querySelectorAll('.pin input').forEach(inp=>inp.oninput=e=>{const r=ROWS.find(x=>'pi-'+x.id===inp.id);r.edit=+e.target.value||0;});
  document.querySelectorAll('[data-upd]').forEach(b=>b.onclick=()=>{const r=ROWS.find(x=>x.id===b.dataset.upd);const fl=econ(0,r.x).floor;
    if(r.edit<fl){openPop=r.id;drawPR();toast(`₹${r.edit} is below your ₹${fl} floor. Check the slider before updating.`);return;}
    r.cur=r.edit;openPop=null;drawPR();toast(`${r.name}: price updated to ₹${r.edit}`);});
  if(openPop){const r=ROWS.find(x=>x.id===openPop);
    $('pop-range').oninput=e=>{r.edit=+e.target.value;$('pi-'+r.id).value=r.edit;updPop(r);};
    $('pop-cancel').onclick=()=>{openPop=null;r.edit=r.rec;drawPR();};
    $('pop-ok').onclick=()=>{const fl=econ(0,r.x).floor;r.cur=r.edit;openPop=null;drawPR();toast(r.edit<fl?`Updated to ₹${r.edit}. You chose a price below your floor.`:`${r.name}: price updated to ₹${r.edit}`);};
    updPop(r);}
}
function popRange(r){const fl=econ(0,r.x).floor;return [Math.round(Math.min(fl,r.rec)*0.75/10)*10,Math.round(Math.max(r.cur,fl)*1.35/10)*10];}
function popHTML(r){const [lo,hi]=popRange(r),fl=econ(0,r.x).floor,pc=v=>Math.max(0,Math.min(100,(v-lo)/(hi-lo)*100)).toFixed(1);
  return `<div class="pop" role="dialog" aria-label="Adjust price">
    <div style="display:flex;justify-content:space-between;font-size:12px"><span class="num">${inr(lo)}</span><b class="num" id="pop-val" style="font-size:14px"></b><span class="num">${inr(hi)}</span></div>
    <input type="range" id="pop-range" min="${lo}" max="${hi}" step="1" value="${r.edit}" aria-label="Price">
    <div class="flowtrack"><div class="lz" style="width:${pc(fl)}%"></div><div class="bz" style="left:${pc(400*r.m)}%;width:${pc(480*r.m)-pc(400*r.m)}%"></div></div>
    <div class="scale"><span style="left:${pc(fl)}%;color:var(--loss)">floor ${inr(fl)}</span><span style="left:${pc(r.rec)}%;top:15px;color:#3949AB">rec ${inr(r.rec)}</span></div>
    <div class="settle" id="pop-settle"></div><div class="msg" id="pop-msg"></div>
    <div class="row2"><button class="btn ghost" id="pop-cancel">Cancel</button><button class="btn ghost" id="pop-ok">Update</button></div></div>`;}
function updPop(r){const e=econ(r.edit,r.x),fl=e.floor,m=r.m;
  $('pop-val').textContent=inr(r.edit);$('pop-settle').textContent='Bank Settlement: '+inr(settle(r.edit,r.x));
  const msg=$('pop-msg');
  if(r.edit<fl){msg.className='msg bad';msg.innerHTML=`<b>Competitive, but below your floor.</b> You lose ${amt(e.contribKept)} on every kept order.`;}
  else if(r.edit<=480*m){msg.className='msg good';msg.innerHTML=`<b>Competitive and profitable.</b> You earn ${inr(e.contribKept)} per kept order.`;}
  else {msg.className='msg meh';msg.innerHTML=`<b>Profitable, but above where most orders land.</b> You earn ${inr(e.contribKept)} per kept order, on fewer orders.`;}
}

/* ================= QUALITY ================= */
function renderQuality(sc){
  const S=D(),Q=S.quality;
  const now={...S.base,...Q.now},nowRet=now.ret,fixed={...now,ret:nowRet*(1-Q.fixShare)};
  const fN=econ(0,now).floor,fB=econ(0,{...S.base,...Q.catNorm}).floor,fF=econ(0,fixed).floor;
  sc.innerHTML=`
  <div class="ratings"><div><div class="muted">Overall rating</div><div class="v">${Q.rating} ★</div></div><div><div class="muted">Return rate, last 30 days</div><div class="v">${Q.mine}</div><div class="muted" style="font-size:12px">Category: ${Q.catLabel}</div></div><div><div class="muted">Catalog</div><div class="v" style="font-size:16px">${Q.catalog}</div></div></div>
  <div class="card">
    <h2 style="text-transform:uppercase;font-size:13px;letter-spacing:.05em;color:var(--muted)">Your top returns reasons</h2>
    <div class="qgrid">${Q.reasons.map(r=>`<div class="reason"><h4>${r[0]}</h4><small>${r[1]} % of all returns</small><div class="tip">${r[2]}</div></div>`).join('')}</div>
    <div class="sd-box" style="margin-top:18px">
      <span class="sd-badge">Sahi Daam · What returns cost you</span>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:10px">
        <div><div class="lbl">Floor at category return rate</div><div class="num" style="font-size:22px">${inr(fB)}</div></div>
        <div><div class="lbl">Floor at your ${Q.mine} return rate</div><div class="num" style="font-size:22px;color:var(--loss)">${inr(fN)}</div></div>
        <div><div class="lbl">${Q.fixLabel}</div><div class="num" style="font-size:22px;color:var(--gain)">${inr(fF)}</div></div>
      </div>
      <p style="margin:10px 0 0">Returns above the category rate add <b>${inr(fN-fB)}</b> to the lowest price you can survive at. ${Q.fixWhat} is worth <b>${inr(fN-fF)}</b> per piece, without cutting your price.</p>
      <div class="sd-actions"><button class="btn sd" id="q-fix">${Q.fixBtn}</button><span class="muted" style="font-size:12.5px">Sahi Daam will track returns for 14 days before touching price.</span></div>
    </div>
  </div>`;
  $('q-fix').onclick=()=>toast(Q.fixToast);
}

/* ================= AUTOPILOT ================= */
let lang='en';
const STAGES={LAUNCH:'Buy information, ranking and reviews',LEARN:'Find the shape of demand',LIFT:'Harvest without breaking rank',DEFEND:'Protect contribution, not rank'};
const evX=i=>({...D().base,...D().events[i].x});
function signals(i){
  const S=D(),ev=S.events[i],x=evX(i),price=S.ap.accepted[i]?ev.after:ev.price,e=econ(price,x),m=ev.m,pos=bandPos(price);
  const P=(c,t)=>`<span class="pill ${c}">${t}</span>`;
  const avgTxt=m.avgLabel?`${m.avg}% ${m.avgLabel}`:`${m.avg}% avg`;
  return [
   ['1. Views',m.views===null?'new listing':(m.views>0?'+':'−')+Math.abs(m.views)+'% WoW','Falls >30% WoW, no season change',m.views===null?P('na','—'):(m.views<=-30&&!m.season)?P('loss','Act'):m.views<=-15?P('watch','Watch'):P('ok','OK')],
   ['2. View → order rate',m.vo===null?'no data yet':m.vo+'% of median','Below 60% of cluster median, 7 days',m.vo===null?P('na','—'):m.vo<60?P('loss','Act'):m.vo<80?P('watch','Watch'):P('ok','OK')],
   ['3. Earning / kept order',inr(e.contribKept),'Negative, or below ₹25 target',e.contribKept<0?P('loss','Act'):e.contribKept<25?P('watch','Watch'):P('ok','OK')],
   ['4. Failure rate',m.fail===null?'no data yet':m.fail+'% vs '+avgTxt,'>5 pts above own 30-day avg (or category, if new)',m.fail===null?P('na','—'):(m.fail-m.avg>=5)?P('loss','Act'):(m.fail-m.avg>3)?P('watch','Watch'):P('ok','OK')],
   ['5. Band position',Math.round(pos)+'th pct','Outside middle 50% of band',(pos<25||pos>75)?P('watch','Watch'):P('ok','OK')],
   ['6. Cost inputs',m.costNew||'unchanged','Cost, slab, fee, GST or rate change',m.costNew?P('watch','Recompute'):P('ok','OK')]
  ];
}
function renderAutopilot(sc){
  const S=D();
  sc.innerHTML=`<div class="sd-box" style="margin-bottom:14px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center">
    <span class="sd-badge">Autopilot · ${S.apCatalog}</span>
    <span>Your range: floor <b class="num">${inr(econ(0,S.base).floor)}</b> to ceiling <b class="num">${inr(S.ceiling)}</b></span>
    <span>Goal: highest earning per 1,000 views</span><span>Updates: WhatsApp, max 1 a week</span></div>
  <div class="ap">
    <div class="phone"><div class="scr">
      <div class="wa"><div class="av">SD</div><div><b>Sahi Daam</b><small>Meesho Supplier · verified</small></div>
        <div class="lang" role="group" aria-label="Language"><button id="l-en" aria-pressed="${lang==='en'}">EN</button><button id="l-hi" aria-pressed="${lang==='hi'}">हिं</button></div></div>
      <div class="msgs" id="msgs" aria-live="polite"></div></div></div>
    <div>
      <div class="timeline" id="timeline"></div>
      <div class="card" style="margin-top:12px">
        <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
          <div><span class="lbl">Lifecycle stage</span><div style="margin-top:4px"><span class="stage" id="ap-stage"></span> <span class="muted" id="ap-job"></span></div></div>
          <div style="text-align:right"><span class="lbl">Live Meesho Price</span><div class="num" style="font-size:22px" id="ap-price"></div></div>
        </div>
        <div style="margin-top:12px"><span class="lbl" id="ap-when"></span><div style="font-size:15px" id="ap-what"></div></div>
        <div style="margin-top:12px"><span class="lbl">Autopilot corridor</span><div class="corr-track" id="corr"></div></div>
        <div style="overflow-x:auto"><table class="sig"><thead><tr><th>Signal</th><th>Now</th><th>Trigger</th><th>Status</th></tr></thead><tbody id="sig"></tbody></table></div>
        <div class="rule" id="ap-rule"></div>
        <button class="btn sd" id="ap-next" style="margin-top:12px">Next event →</button>
      </div>
    </div>
  </div>`;
  $('l-en').onclick=()=>{lang='en';renderAutopilot(sc);};$('l-hi').onclick=()=>{lang='hi';renderAutopilot(sc);};
  $('ap-next').onclick=()=>{const a=D().ap,n=D().events.length;if(a.cur<a.reached)a.cur++;else if(a.accepted[a.reached]&&a.reached<n-1){a.reached++;a.cur=a.reached;}drawAP();};
  drawAP();
}
function drawAP(){
  const S=D(),A=S.ap,EV=S.events,ev=EV[A.cur],x=evX(A.cur),price=A.accepted[A.cur]?ev.after:ev.price,e=econ(price,x);
  $('ap-stage').textContent=ev.stage;$('ap-job').textContent='· '+STAGES[ev.stage];$('ap-price').textContent=inr(price);
  $('ap-when').textContent=`${ev.d} · ${ev.date} · ${ev.name}`;$('ap-what').textContent=ev.what;
  const fl=e.floor,ceil=S.ceiling,lo=180,hi=580,pc=v=>((Math.max(lo,Math.min(hi,v))-lo)/(hi-lo)*100).toFixed(1)+'%';
  let c=`<div class="corr-line"></div><div class="corr-zone" style="left:${pc(fl)};width:calc(${pc(ceil)} - ${pc(fl)})"></div>`;
  c+=`<div class="corr-mark" style="left:${pc(fl)};color:var(--loss)"><i style="background:var(--loss)"></i>floor ${inr(fl)}</div>`;
  c+=`<div class="corr-mark" style="left:${pc(ceil)};color:var(--muted)"><i style="background:var(--muted)"></i>ceiling ${inr(ceil)}</div>`;
  if(ev.entrant)c+=`<div class="corr-mark" style="left:${pc(ev.entrant)};color:#7C68A6"><i style="background:#7C68A6"></i>entrant ${inr(ev.entrant)}</div>`;
  c+=`<div class="corr-mark" style="left:${pc(price)};top:-4px"><i style="background:var(--ink);height:34px;width:4px"></i></div>`;
  $('corr').innerHTML=c;
  $('sig').innerHTML=signals(A.cur).map(r=>`<tr><td>${r[0]}</td><td class="val">${r[1]}</td><td class="muted">${r[2]}</td><td>${r[3]}</td></tr>`).join('');
  $('ap-rule').innerHTML='<b>Why this nudge.</b> '+ev.rule;
  const nb=$('ap-next');const canNext=A.cur<A.reached||(A.accepted[A.reached]&&A.reached<EV.length-1);
  nb.disabled=!canNext;nb.textContent=canNext?'Next event →':(A.reached===EV.length-1&&A.accepted[A.reached]?'Journey complete':'Tap the WhatsApp button to continue');
  $('timeline').innerHTML=EV.map((v,i)=>`<button class="tl ${A.accepted[i]?'done':''}" ${i===A.cur?'aria-current="step"':''} ${i>A.reached?'disabled':''} data-i="${i}"><div class="d">${v.d} · ${v.date}</div><div class="n">${v.name}</div></button>`).join('');
  $('timeline').querySelectorAll('.tl').forEach(b=>b.onclick=()=>{A.cur=+b.dataset.i;drawAP();});
  let h='';
  for(let i=0;i<=A.reached;i++){const v=EV[i],xi=evX(i),t=S.T(i,xi,econ(v.price,xi).floor);
    h+=`<div class="day">${v.d} · ${v.date}</div>`;
    if(i===0)h+=`<div class="b me">${S.first[lang]}<span class="t">10:02</span></div>`;
    t[lang].forEach(([cl,tx])=>h+=`<div class="b ${cl}">${tx}<span class="t">10:0${i+3}</span></div>`);
    if(A.accepted[i]){h+=`<div class="b me">${t.cta[lang]}<span class="t">10:1${i}</span></div><div class="b">${t.reply[lang]}<span class="t">10:1${i}</span></div>`;if(i===A.reached)h+=`<button class="undo" data-undo="${i}">${lang==='en'?'Undo':'पहले जैसा करें'}</button>`;}
    else if(i===A.reached)h+=`<button class="cta" data-cta="${i}">${t.cta[lang]}</button>`;}
  const box=$('msgs');box.innerHTML=h;box.scrollTop=box.scrollHeight;
  box.querySelectorAll('[data-cta]').forEach(b=>b.onclick=()=>{A.accepted[+b.dataset.cta]=true;A.cur=+b.dataset.cta;drawAP();});
  box.querySelectorAll('[data-undo]').forEach(b=>b.onclick=()=>{A.accepted[+b.dataset.undo]=false;A.cur=+b.dataset.undo;drawAP();});
}

    ${row('orders','New order alerts','Get a WhatsApp message when a new order arrives.')}
    ${row('payments','Payment updates','Get a WhatsApp message when a payment is sent.')}
    ${row('sd','Weekly pricing nudge','At most one message a week when a signal fires: your floor moved, a price test finished, or a rival priced below your floor.',true)}
    <div class="setrow"><div><div style="font-weight:500">Nudge language <span class="tag sd" style="margin-left:6px">Sahi Daam</span></div><div class="muted" style="font-size:13px">Pricing messages are sent in this language.</div></div>
      <select id="s-lang" style="border:1px solid var(--sd-line);border-radius:4px;padding:6px"><option value="en">English</option><option value="hi">हिन्दी</option><option disabled>ગુજરાતી (soon)</option></select></div>
  </div>`;
  $('s-lang').value=lang;$('s-lang').onchange=e=>{lang=e.target.value;toast('Nudge language saved');};
  sc.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{SET[b.dataset.sw]=!SET[b.dataset.sw];b.setAttribute('aria-checked',SET[b.dataset.sw]);});
}

function renderAbout(sc){
  sc.innerHTML=`<div class="engines">
    <div class="card"><h2>1 · Floor engine</h2><dl><dt>Where</dt><dd>Catalog Upload, next to Meesho Price</dd><dt>Inputs</dt><dd>Purchase cost and GST from the seller; shipping, RTO and return rates from Meesho</dd><dt>Prototype</dt><dd><span class="pill ok">Real math</span> Ramesh’s floor reproduces the deck’s ₹345 (₹346 rounded up)</dd></dl></div>

    <div class="card"><h2>Still to confirm with the mentor</h2><ul class="clean">
      <li>Exact shipping per weight slab, and what else is in the settlement deduction (the tutorial shows about ₹90–100 between price and settlement).</li>
      <li>Is GST included in Meesho Price or added on top?</li>
      <li>Can a prototype read real cluster order data, or should it stay simulated?</li></ul></div>
  </div>`;
}

/* ================= BOOT ================= */
const h=(location.hash||'').slice(1),[hs,hk]=h.split('-');
if(SELLERS[hk])SEL=hk;
renderWho();
go(h&&(TITLES[hs]||PH[hs])?hs:'choose');
window.addEventListener('hashchange',()=>{
  const [s,k]=(location.hash||'').slice(1).split('-');
  if(SELLERS[k]&&k!==SEL){SEL=k;try{localStorage.setItem('sd-seller',k)}catch(e){}renderWho();}
